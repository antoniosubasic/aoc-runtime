name: Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach binaries to
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every target builds natively with a stable toolchain and no C
  # cross-compilation: TLS is rustls, so there is no OpenSSL to link. The Linux
  # runners are deliberately the oldest supported ones, so the binaries work on
  # distributions with an older glibc than the newest runner image ships.
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
        shell: bash

      - name: Package
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          name="aoc-${TAG}-${TARGET}"
          mkdir -p "dist/${name}"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${TARGET}/release/aoc.exe" "dist/${name}/"
          else
            cp "target/${TARGET}/release/aoc" "dist/${name}/"
          fi
          cp README.md LICENSE "dist/${name}/"

          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${name}.zip" "${name}" > /dev/null
            echo "asset=dist/${name}.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "${name}.tar.gz" "${name}"
            echo "asset=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  publish:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber
