name: Release new Version 🚀

on:
  push:
    tags:
      - v*

permissions:
  contents: write 

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 🛠️ Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🏷️ Extract tag name
        id: tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: 🔀 Switch to main and merge new release
        run: |
          git checkout main
          git merge --no-ff "$TAG" -m "release: $TAG"

      - name: 🦀 Bump version in Cargo.toml
        run: sed -i -E "s/^version\s*=\s*\"[0-9]+\.[0-9]+\.[0-9]+\"/version = \"${TAG#v}\"/" Cargo.toml

      - name: 📦 Bump version in Cargo.lock
        run: cargo update --package aoc-runtime

      - name: 📝 Commit (amend) bumped versions
        run: |
          git add Cargo.toml Cargo.lock
          git commit --amend --no-edit

      - name: 🚀 Push new release
        run: git push origin main
