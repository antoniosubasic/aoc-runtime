[package]
name = "aoc-runtime"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
authors = ["Antonio Subašić <antonio.subasic.public@gmail.com>"]
description = "a runtime automation tool for Advent of Code: scaffold, run and submit puzzle solutions"
repository = "https://github.com/antoniosubasic/aoc-runtime"
homepage = "https://github.com/antoniosubasic/aoc-runtime"
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["advent-of-code", "aoc", "cli", "automation"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", ".editorconfig", "deny.toml", "release-plz.toml"]

[lib]
name = "aoc_runtime"
path = "src/lib.rs"

[[bin]]
name = "aoc"
path = "src/main.rs"

[dependencies]
aoc_api = "3.0.4"
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
clap = { version = "4.5.41", features = ["derive"] }
colored = "3.0.0"
dirs = "6.0.0"
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml_ng = "0.10.0"
thiserror = "2.0.12"
tokio = { version = "1.47.0", features = ["rt"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
